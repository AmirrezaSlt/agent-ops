server {
    listen 80;
    server_name localhost;

    # Root redirect to agent-ops
    location = / {
        return 301 /agent-ops/;
    }

    # Frontend
    location /agent-ops/ {
        proxy_pass http://agent-ops-frontend-1:5173/agent-ops/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Backend API
    location /agent-ops/api/ {
        proxy_pass http://agent-ops-backend-1:8000/agent-ops/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Backend Admin
    location /agent-ops/admin/ {
        proxy_pass http://agent-ops-backend-1:8000/agent-ops/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Backend Static
    location /agent-ops/static/ {
        proxy_pass http://agent-ops-backend-1:8000/agent-ops/static/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
} 